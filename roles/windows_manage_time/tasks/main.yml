---
- name: Configure NTP servers
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
    name: NtpServer
    data: "{{ windows_manage_time_ntp_servers | join(' ') }}"
    type: string
  register: windows_manage_time_ntp_result

- name: Apply NTP configuration
  ansible.windows.win_command: w32tm /config /update
  when: windows_manage_time_ntp_result is changed

- name: Configure timezone
  ansible.windows.win_timezone:
    timezone: "{{ windows_manage_time_timezone }}"
  register: windows_manage_time_tz_result

- name: Reboot system
  ansible.windows.win_reboot:
    reboot_timeout: 600
    msg: "Ansible reboot after timezone configuration"
  when:
    - windows_manage_time_reboot | bool
    - windows_manage_time_tz_result is changed
